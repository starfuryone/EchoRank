<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EchoRank Importer</title>
    <style>
      :root { --blue: #2563eb; --gray: #6b7280; --ok: #16a34a; --bad: #dc2626; }
      * { box-sizing: border-box; }
      body { width: 320px; margin: 0; font: 13px/1.4 system-ui, sans-serif; color: #111; }
      header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #eee; }
      header strong { font-size: 14px; }
      .body { padding: 14px; }
      .row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
      .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
      button { width: 100%; padding: 9px; border: 0; border-radius: 7px; font-weight: 600; cursor: pointer; }
      button.primary { background: var(--blue); color: #fff; }
      button.primary:disabled { background: #9db8f2; cursor: not-allowed; }
      button.link { background: none; color: var(--blue); width: auto; padding: 0; font-weight: 500; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; text-align: center; }
      .stat { background: #f8fafc; border-radius: 7px; padding: 8px 4px; }
      .stat b { display: block; font-size: 18px; }
      .stat span { color: var(--gray); font-size: 11px; }
      .msg { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 12px; }
      .msg.ok { background: #f0fdf4; color: #166534; } .msg.bad { background: #fef2f2; color: #991b1b; }
      .settings { display: none; margin-top: 12px; border-top: 1px solid #eee; padding-top: 12px; }
      .settings.open { display: block; }
      input { width: 100%; padding: 7px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
      label { display: block; color: var(--gray); margin: 8px 0 3px; font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <strong>EchoRank Review Importer</strong>
    </header>
    <div class="body">
      <div class="row"><span id="login-status"><span class="dot bad"></span>Not connected</span></div>
      <div class="row"><span id="site-status"><span class="dot bad"></span>Site not supported</span></div>

      <div class="stats">
        <div class="stat"><b id="found">0</b><span>Found</span></div>
        <div class="stat"><b id="imported">0</b><span>Imported</span></div>
        <div class="stat"><b id="failed">0</b><span>Failed</span></div>
      </div>

      <button class="primary" id="scan" disabled>Scan &amp; Import Reviews</button>
      <div id="msg" class="msg" style="display:none"></div>

      <div class="row" style="margin-top:10px">
        <button class="link" id="toggle-settings">Settings</button>
      </div>

      <div class="settings" id="settings">
        <label>API Token (from EchoRank → Extension)</label>
        <input id="token" type="password" placeholder="er_ext_…" />
        <label>API Base URL</label>
        <input id="apibase" type="text" placeholder="https://echorank360.com" />
        <button class="primary" id="save" style="margin-top:10px">Save</button>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
