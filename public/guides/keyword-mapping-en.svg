  <line x1="92" y1="94" x2="668" y2="94" stroke="#2a3038"/>
  <g font-size="10" fill="#9aa4af">
    <text x="92" y="114">PAGE</text><text x="420" y="114">PRIMARY KEYWORD</text>
  </g>
  <g font-size="13" fill="#9aa4af">
