h="180" height="230" rx="10" fill="#1E2329" stroke="#2B3139" stroke-width="2"/><text x="1018" y="226" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#FCD535" text-anchor="middle">Authority</text><text x="1018" y="280" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#EAECEF" text-anchor="middle">Which sources</text><text x="1018" y="306" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#EAECEF" text-anchor="middle">get cited?</text><text x="1018" y="375" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#848E9C" text-anchor="middle">you influence</text><text x="600" y="490" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#848E9C" text-anchor="middle">Foundation (pillars 1–2) is yours to fix; outcomes (3–5) are measured</text></svg>