<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Splitting AI search work between you and your AI agent"><defs><linearGradient id="y1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE38A"/><stop offset="1" stop-color="#F0B90B"/></linearGradient><marker id="ay1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FCD535"/></marker></defs><rect width="1200" height="620" fill="#181A20"/><text x="60" y="60" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#EAECEF" text-anchor="start">Who does what</text><rect x="60" y="100" width="500" height="480" rx="18" fill="#1E2329" stroke="#FCD535" stroke-width="2"/><text x="310" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#FCD535" text-anchor="middle">You</text><rect x="90" y="200" width="440" height="48" rx="10" fill="#2B3139"/><text x="110" y="231" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#EAECEF" text-anchor="start">Choose target questions</text><rect x="90" y="262" width="440" height="48" rx="10" fill="#2B3139"/><text x="110" y="293" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#EAECEF" text-anchor="start">Publish facts only you know</text><rect x="90" y="324" width="440" height="48" rx="10" fill="#2B3139"/><text x="110" y="355" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#EAECEF" text-anchor="start">Brand voice and claims</text><rect x="90" y="386" width="440" height="48" rx="10" fill="#2B3139"/><text x="110" y="417" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#EAECEF" text-anchor="start">Crawler policy decisions</text><rect x="90" y="448" width="440" height="48" rx="10" fill="#2B3139"/><text x="110" y="479" font-family="Inter, 'Seg