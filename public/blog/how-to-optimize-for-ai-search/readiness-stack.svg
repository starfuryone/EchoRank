xt><rect x="155.0" y="400" width="890" height="84" rx="14" fill="#1E2329" stroke="#2B3139"/><text x="600" y="436" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#FCD535" text-anchor="middle">Renderable</text><text x="600" y="464" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#EAECEF" text-anchor="middle">Key content in the raw HTML</text><rect x="100.0" y="500" width="1000" height="84" rx="14" fill="#2B3139" stroke="#2B3139"/><text x="600" y="536" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#FCD535" text-anchor="middle">Crawlable</text><text x="600" y="564" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#EAECEF" text-anchor="middle">AI crawlers allowed and not blocked</text><text x="1150" y="612" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#848E9C" text-anchor="end">Each layer depends on the one below it</text></svg>