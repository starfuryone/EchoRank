<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Improvement loop: ask, audit, fix, re-check"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE38A"/><stop offset="1" stop-color="#F0B90B"/></linearGradient><marker id="arlg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FCD535"/></marker></defs><rect width="1200" height="620" fill="#181A20"/><text x="60" y="60" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#EAECEF">The AI visibility improvement loop</text><ellipse cx="600" cy="345" rx="330" ry="190" fill="none" stroke="#2B3139" stroke-width="4"/><path d="M723.6,168.8 A330,190 0 0 1 906.0,273.8" fill="none" stroke="#FCD535" stroke-width="4" marker-end="url(#arlg)"/><path d="M906.0,416.2 A330,190 0 0 1 723.6,521.2" fill="none" stroke="#FCD535" stroke-width="4" marker-end="url(#arlg)"/><path d="M476.4,521.2 A330,190 0 0 1 294.0,416.2" fill="none" stroke="#FCD535" stroke-width="4" marker-end="url(#arlg)"/><path d="M294.0,273.8 A330,190 0 0 1 476.4,168.8" fill="none" stroke="#FCD535" stroke-width="4" marker-end="url(#arlg)"/><rect x="460" y="105" width="280" height="100" rx="16" fill="#1E2329" stroke="#FCD535" stroke-width="2"/><text x="600" y="141" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#FCD535">1  Ask</text><text x="600" y="169" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#EAECEF">Run buyer-style prompts</text><text x="600" y="191" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#848E9C">on a schedule</text><rect x="790" y="295" width="280" height="100" rx="16" fill="#1E2329" stroke="#FCD535" stroke-width="2"/><text x="930" y="331" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#FCD535">2  Audit</text><text x="930" y="359" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#EAECEF">Recognition, accuracy,</text><text x="930" y="381" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#848E9C">competitors, sources</text><rect x="460" y="485" width="280" height="100" rx="16" fill="#1E2329" stroke="#FCD535" stroke-width="2"/><text x="600" y="521" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#FCD535">3  Fix</text><text x="600" y="549" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#EAECEF">Update pages, earn coverage,</text><text x="600" y="571" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#848E9C">open crawler access</text><rect x="130" y="295" width="280" height="100" rx="16" fill="#1E2329" stroke="#FCD535" stroke-width="2"/><text x="270" y="331" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#FCD535">4  Re-check</text><text x="270" y="359" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#EAECEF">Compare answers</text><text x="270" y="381" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#848E9C">over time</text><rect x="552" y="297" width="96" height="96" rx="10.6" fill="url(#lg)" transform="rotate(45 600 345)"/></svg>