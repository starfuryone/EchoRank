<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Funnel: a question becomes several searches, many results, fewer pages read, and only a few cited sources"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE38A"/><stop offset="1" stop-color="#F0B90B"/></linearGradient><marker id="arfg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FCD535"/></marker></defs><rect width="1200" height="620" fill="#181A20"/><text x="60" y="60" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#EAECEF">How a live web answer is assembled</text><rect x="100.0" y="95" width="1000" height="84" rx="14" fill="#1E2329" stroke="#2B3139"/><text x="600" y="131" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#EAECEF">Your question</text><text x="600" y="159" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">“Best AI marketing platforms?”</text><rect x="170.0" y="195" width="860" height="84" rx="14" fill="#2B3139" stroke="#2B3139"/><text x="600" y="231" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#EAECEF">Several searches</text><text x="600" y="259" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">comparisons · pricing · reviews</text><rect x="240.0" y="295" width="720" height="84" rx="14" fill="#1E2329" stroke="#2B3139"/><text x="600" y="331" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#EAECEF">Search results</text><text x="600" y="359" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">many pages are found</text><rect x="320.0" y="395" width="560" height="84" rx="14" fill="#2B3139" stroke="#2B3139"/><text x="600" y="431" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#EAECEF">Pages actually read</text><text x="600" y="459" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">only a selection is opened</text><rect x="400.0" y="495" width="400" height="84" rx="14" fill="url(#fg)" stroke="#2B3139"/><text x="600" y="531" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#181A20">Cited in the answer</text><text x="600" y="559" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#181A20">a few sources are linked</text><text x="600" y="600" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#FCD535">Being found ≠ being cited</text></svg>