<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Three pathways feed a ChatGPT answer: training knowledge, live web retrieval, and user context"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE38A"/><stop offset="1" stop-color="#F0B90B"/></linearGradient><marker id="arpg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FCD535"/></marker></defs><rect width="1200" height="560" fill="#181A20"/><text x="60" y="60" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#EAECEF">Three pathways into one answer</text><rect x="60" y="100" width="330" height="190" rx="16" fill="#1E2329" stroke="#2B3139" stroke-width="2"/><circle cx="96" cy="140" r="18" fill="#FCD535"/><text x="96" y="147" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#181A20">1</text><text x="126" y="147" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#EAECEF">Training knowledge</text><text x="90" y="190" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">• Public web, licensed data</text><text x="90" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">• Human-created material</text><text x="90" y="250" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">• Frozen at a cutoff date</text><rect x="435" y="100" width="330" height="190" rx="16" fill="#1E2329" stroke="#2B3139" stroke-width="2"/><circle cx="471" cy="140" r="18" fill="#FCD535"/><text x="471" y="147" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#181A20">2</text><text x="501" y="147" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#EAECEF">Live web retrieval</text><text x="465" y="190" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">• Searches at question time</text><text x="465" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">• Reads selected pages</text><text x="465" y="250" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">• Can show source links</text><rect x="810" y="100" width="330" height="190" rx="16" fill="#1E2329" stroke="#2B3139" stroke-width="2"/><circle cx="846" cy="140" r="18" fill="#FCD535"/><text x="846" y="147" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#181A20">3</text><text x="876" y="147" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#EAECEF">Your context</text><text x="840" y="190" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">• Chat text and uploads</text><text x="840" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">• Memories, instructions</text><text x="840" y="250" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#848E9C">• Connected apps</text><path d="M225,295 C225,360 600,350 600,395" fill="none" stroke="#FCD535" stroke-width="3" marker-end="url(#arpg)"/><path d="M600,295 C600,360 600,350 600,395" fill="none" stroke="#FCD535" stroke-width="3" marker-end="url(#arpg)"/><path d="M975,295 C975,360 600,350 600,395" fill="none" stroke="#FCD535" stroke-width="3" marker-end="url(#arpg)"/><rect x="390" y="400" width="420" height="110" rx="18" fill="url(#pg)"/><text x="600" y="448" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#181A20">ChatGPT answer</text><text x="600" y="482" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#181A20">often blends all three in one reply</text></svg>