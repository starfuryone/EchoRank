      <rect x="912" y="262" width="18" height="208" rx="3"/><rect x="1112" y="250" width="18" height="220" rx="3"/>
    </g>
    <g fill="#F0B90B">
      <rect x="134" y="392" width="18" height="78" rx="3"/><rect x="334" y="386" width="18" height="84" rx="3"/>
      <rect x="534" y="374" width="18" height="96" rx="3"/><rect x="734" y="352" width="18" height="118" rx="3"/>
      <rect x="934" y="336" width="18" height="134" rx="3"/><rect x="1134" y="318" width="18" height="152" rx="3"/>
    </g>
    <g fill="#3B4753">
      <rect x="156" y="414" width="18" height="56" rx="3"/><rect x="356" y="410" width="18" height="60" rx="3"/>
      <rect x="556" y="404" width="18" height="66" rx="3"/><rect x="756" y="398" width="18" height="72" rx="3"/>
      <rect x="956" y="390" width="18" height="80" rx="3"/><rect x="1156" y="382" width="18" height="88" rx="3"/>
    </g>
    <g fill="#0ECB81">
      <rect x="178" y="432" width="18" height="38" rx="3"/><rect x="378" y="428" width="18" height="42" rx="3"/>
      <rect x="578" y="424" width="18" height="46" rx="3"/><rect x="778" y="420" width="18" height="50" rx="3"/>
      <rect x="978" y="414" width="18" height="56" rx="3"/><rect x="1178" y="406" width="18" height="64" rx="3"/>
    </g>
  </g>
  <!-- legend -->
  <g font-size="17" fill="#B7BDC6">
    <rect x="112" y="126" width="14" height="14" rx="3" fill="#FCD535"/><text x="136" y="139">Coverage</text>
    <rect x="272" y="126" width="14" height="14" rx="3" fill="#F0B90B"/><text x="296" y="139">Citations</text>
    <rect x="428" y="126" width="14" height="14" rx="3" fill="#3B4753"/><text x="452" y="139">Position</text>
