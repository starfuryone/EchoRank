  </g>
  <text x="1270" y="139" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#848E9C" letter-spacing="2.2">FROZEN PROMPT SET</text>
</svg>
