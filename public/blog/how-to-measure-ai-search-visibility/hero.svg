<svg viewBox="0 0 1400 600" width="1400" height="600" xmlns="http://www.w3.org/2000/svg" font-family="Geist, system-ui, sans-serif">
  <rect width="1400" height="600" fill="#181A20"/>
  <rect x="70" y="70" width="1260" height="460" rx="16" fill="#1E2329" stroke="#2B3139"/>
  <!-- weekly run ticks along the baseline -->
  <g stroke="#2B3139" stroke-width="1">
    <line x1="130" y1="118" x2="130" y2="470"/><line x1="330" y1="118" x2="330" y2="470"/>
    <line x1="530" y1="118" x2="530" y2="470"/><line x1="730" y1="118" x2="730" y2="470"/>
    <line x1="930" y1="118" x2="930" y2="470"/><line x1="1130" y1="118" x2="1130" y2="470"/>
  </g>
  <line x1="110" y1="470" x2="1270" y2="470" stroke="#2B3139" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#848E9C" letter-spacing="1.4">
    <text x="130" y="500">W1</text><text x="330" y="500">W2</text><text x="530" y="500">W3</text>
    <text x="730" y="500">W4</text><text x="930" y="500">W5</text><text x="1130" y="500">W6</text>
  </g>
