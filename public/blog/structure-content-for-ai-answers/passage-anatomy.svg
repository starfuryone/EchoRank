<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460"><rect width="1100" height="460" fill="#0b1220"/><g font-family="Arial,Helvetica,sans-serif"><rect x="70" y="60" width="500" height="340" rx="12" fill="#111c33" stroke="#334155" stroke-width="2"/><text x="100" y="115" fill="#93c5fd" font-size="26" font-weight="bold">How often should you re-run?</text><rect x="100" y="140" width="440" height="70" rx="8" fill="#0e2a22" stroke="#6ee7b7" stroke-width="2"/><text x="115" y="170" fill="#6ee7b7" font-size="20">Weekly. Direct answer, first sentence,</text><text x="115" y="196" fill="#6ee7b7" font-size="20">self-contained claim with a number.</text><g fill="#334155"><rect x="100" y="235" width="440" height="12" rx="6"/><rect x="100" y="260" width="400" height="12" rx="6"/><rect x="100" y="285" width="430" height="12" rx="6"/><rect x="100" y="310" width="360" height="12" rx="6"/><rect x="100" y="335" width="410" height="12" rx="6"/></g><g fill="#94a3b8" font-size="20"><text x="620" y="130">↑ question-shaped heading = query match</text><text x="620" y="180" fill="#6ee7b7">↑ payload on top = what gets quoted</text><text x="620" y="290">↑ evidence and caveats follow,</text><text x="620" y="318">not the other way around</text></g><text x="70" y="440" fill="#64748b" font-size="20">75–300 words per heading; each section must survive alone.</text></g></svg>
