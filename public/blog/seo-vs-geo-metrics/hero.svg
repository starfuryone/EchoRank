<svg viewBox="0 0 1400 600" width="1400" height="600" xmlns="http://www.w3.org/2000/svg" font-family="Geist, system-ui, sans-serif">
  <rect width="1400" height="600" fill="#181A20"/>
  <rect x="70" y="70" width="1260" height="460" rx="16" fill="#1E2329" stroke="#2B3139"/>
  <text x="330" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#EAECEF" letter-spacing="3">SEO</text>
  <text x="1070" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#FCD535" letter-spacing="3">GEO</text>
  <!-- left column: 7 rows -->
  <g fill="#23282F" stroke="#2B3139">
    <rect x="170" y="184" width="320" height="44" rx="6"/><rect x="170" y="238" width="320" height="44" rx="6"/>
    <rect x="170" y="292" width="320" height="44" rx="6"/><rect x="170" y="346" width="320" height="44" rx="6"/>
    <rect x="170" y="400" width="320" height="44" rx="6"/><rect x="170" y="454" width="320" height="44" rx="6"/>
  </g>
  <g fill="#23282F" stroke="#2B3139">
    <rect x="910" y="184" width="320" height="44" rx="6"/><rect x="910" y="238" width="320" height="44" rx="6"/>
    <rect x="910" y="292" width="320" height="44" rx="6"/><rect x="910" y="400" width="320" height="44" rx="6"/>
  </g>
  <!-- carried-over rows: solid gold connectors -->
  <g stroke="#FCD535" stroke-width="3">
    <line x1="490" y1="206" x2="910" y2="206"/>
    <line x1="490" y1="260" x2="910" y2="260"/>
    <line x1="490" y1="314" x2="910" y2="314"/>
  </g>
  <g fill="#FCD535">
    <rect x="196" y="200" width="180" height="12" rx="6"/><rect x="196" y="254" width="150" height="12" rx="6"/><rect x="196" y="308" width="196" height="12" rx="6"/>
    <rect x="936" y="200" width="180" height="12" rx="6"/><rect x="936" y="254" width="150" height="12" rx="6"/><rect x="936" y="308" width="196" height="12" rx="6"/>
  </g>
  <!-- three unconnected rows, stubbed and struck -->
  <g stroke="#3B4753" stroke-width="3" stroke-dasharray="8 8">
    <line x1="490" y1="368" x2="640" y2="368"/><line x1="490" y1="422" x2="640" y2="422"/><line x1="490" y1="476" x2="640" y2="476"/>
  </g>
  <g stroke="#F6465D" stroke-width="5" stroke-linecap="round">
    <line x1="654" y1="354" x2="686" y2="382"/><line x1="686" y1="354" x2="654" y2="382"/>
    <line x1="654" y1="408" x2="686" y2="436"/><line x1="686" y1="408" x2="654" y2="436"/>
    <line x1="654" y1="462" x2="686" y2="490"/><line x1="686" y1="462" x2="654" y2="490"/>
  </g>
  <g fill="#3B4753">
    <rect x="196" y="362" width="168" height="12" rx="6"/><rect x="196" y="416" width="132" height="12" rx="6"/><rect x="196" y="470" width="184" height="12" rx="6"/>
  </g>
  <!-- GEO-only replacement row -->
  <rect x="936" y="416" width="164" height="12" rx="6" fill="#0ECB81"/>
  <text x="1230" y="504" text-anchor="end" font-size="17" fill="#848E9C">new measures replace them</text>
</svg>
