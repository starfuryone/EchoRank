<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="360" rx="12" fill="#F6F7F9"/>
  <text x="40" y="50" fill="#1F2328" font-size="19" font-weight="800">Cancel your Starter subscription</text>
  <rect x="40" y="68" width="560" height="96" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <g font-size="13" fill="#1F2328">
    <text x="60" y="96"><tspan fill="#1E8E4E" font-weight="700">✓</tspan>  You won't be charged again.</text>
    <text x="60" y="122"><tspan fill="#1E8E4E" font-weight="700">✓</tspan>  You keep full access until Dec 12, 2026.</text>
    <text x="60" y="148"><tspan fill="#1E8E4E" font-weight="700">✓</tspan>  You can resume with one click any time before Dec 12, 2026.</text>
  </g>
  <text x="40" y="192" fill="#374151" font-size="12" font-weight="600">Why are you cancelling? (optional)</text>
  <rect x="40" y="202" width="300" height="34" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="54" y="224" fill="#6B7280" font-size="12">Choose a reason</text>
  <path d="M322 216l5 5 5-5" fill="none" stroke="#6B7280" stroke-width="1.6"/>
  <!-- the confirm button highlighted -->
  <rect x="40" y="262" width="186" height="42" rx="9" fill="#2563EB" stroke="#F0B90B" stroke-width="3"/>
  <text x="133" y="288" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Cancel subscription</text>
  <circle cx="244" cy="283" r="13" fill="#F0B90B"/>
  <text x="244" y="288" text-anchor="middle" fill="#15181E" font-size="14" font-weight="800">3</text>
  <text x="276" y="288" fill="#374151" font-size="13" text-decoration="underline">Keep my plan</text>
</svg>
