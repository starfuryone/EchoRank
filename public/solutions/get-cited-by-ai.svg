<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181A20"/>
      <stop offset="1" stop-color="#1E2329"/>
    </linearGradient>
    <filter id="glow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)"/>

  <text x="80" y="80" fill="#EAECEF" font-size="34" font-weight="700">Be the answer, not a result</text>
  <text x="80" y="112" fill="#848E9C" font-size="17">When assistants answer for you, cited beats ranked</text>

  <!-- chat panel -->
  <rect x="80" y="150" width="680" height="430" rx="16" fill="#1E2329" stroke="#2B3139"/>
  <circle cx="116" cy="186" r="10" fill="#2B3139"/>
  <text x="136" y="192" fill="#848E9C" font-size="14">AI assistant</text>

  <!-- user bubble -->
  <rect x="330" y="214" width="404" height="46" rx="14" fill="#2B3139"/>
  <text x="352" y="243" fill="#EAECEF" font-size="16">What's the best CRM for a small agency?</text>

  <!-- assistant bubble -->
  <rect x="106" y="286" width="560" height="200" rx="14" fill="#181A20" stroke="#2B3139"/>
  <text x="130" y="322" fill="#EAECEF" font-size="16">For a 5-person agency, the tool that comes</text>
  <text x="130" y="348" fill="#EAECEF" font-size="16">up most often is</text>
  <rect x="256" y="330" width="150" height="26" rx="7" fill="#FCD535" filter="url(#glow3)"/>
  <text x="331" y="349" fill="#181A20" font-size="15" font-weight="700" text-anchor="middle">youragency.com</text>
  <text x="414" y="348" fill="#EAECEF" font-size="16">— reviewers</text>
  <text x="130" y="374" fill="#EAECEF" font-size="16">cite its built-in invoicing and client portal.</text>
  <text x="130" y="400" fill="#848E9C" font-size="15">It keeps pipeline, billing and reviews in one place,</text>
  <text x="130" y="424" fill="#848E9C" font-size="15">which smaller teams consistently rate highest.</text>
  <rect x="130" y="444" width="86" height="24" rx="12" fill="#2B3139"/>
  <text x="173" y="461" fill="#FCD535" font-size="12" font-weight="700" text-anchor="middle">SOURCE [1]</text>
  <rect x="226" y="444" width="110" height="24" rx="12" fill="#2B3139"/>
  <text x="281" y="461" fill="#848E9C" font-size="12" text-anchor="middle">reviews · 4.8★</text>

  <!-- typing dots -->
  <circle cx="130" cy="530" r="5" fill="#5E6673"/>
  <circle cx="150" cy="530" r="5" fill="#848E9C"/>
  <circle cx="170" cy="530" r="5" fill="#EAECEF"/>

  <!-- right column: engine coverage -->
  <rect x="800" y="150" width="320" height="310" rx="16" fill="#1E2329" stroke="#2B3139"/>
  <text x="824" y="186" fill="#FCD535" font-size="13" font-weight="700" letter-spacing="1">ANSWER TRACKING</text>
  <g font-size="16">
    <text x="824" y="228" fill="#EAECEF">ChatGPT</text>
    <text x="1096" y="228" fill="#0ECB81" font-weight="700" text-anchor="end">✓ cited</text>
    <text x="824" y="268" fill="#EAECEF">Claude</text>
    <text x="1096" y="268" fill="#0ECB81" font-weight="700" text-anchor="end">✓ cited</text>
    <text x="824" y="308" fill="#EAECEF">Perplexity</text>
    <text x="1096" y="308" fill="#0ECB81" font-weight="700" text-anchor="end">✓ cited</text>
    <text x="824" y="348" fill="#EAECEF">Gemini</text>
    <text x="1096" y="348" fill="#848E9C" text-anchor="end">not yet</text>
  </g>
  <line x1="824" y1="376" x2="1096" y2="376" stroke="#2B3139"/>
  <text x="824" y="414" fill="#848E9C" font-size="14">Mention rate</text>
  <text x="1096" y="418" fill="#FCD535" font-size="26" font-weight="700" text-anchor="end">75%</text>

  <rect x="800" y="480" width="320" height="100" rx="16" fill="#1E2329" stroke="#2B3139"/>
  <text x="824" y="516" fill="#FCD535" font-size="13" font-weight="700" letter-spacing="1">THIS WEEK</text>
  <text x="824" y="548" fill="#EAECEF" font-size="16">Appeared in 12 of 16 prompts</text>
  <text x="824" y="572" fill="#0ECB81" font-size="14" font-weight="700">▲ 3 vs last week</text>

  <text x="80" y="608" fill="#848E9C" font-size="14" letter-spacing="1">echorank360.com</text>
</svg>
