<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Exemple d'un assistant IA qui répond à une question de patient sur les implants dentaires" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title>Exemple d'un assistant IA qui répond à une question de patient sur les implants dentaires</title><rect width="1200" height="720" rx="28" fill="#181A20"/><text x="56" y="72" font-size="15" fill="#FCD535" font-weight="700" text-anchor="start" letter-spacing="2">CE QUE DEMANDENT LES PATIENTS</text><rect x="537" y="104" width="607" height="64" rx="18" fill="#2B3139"/><text x="565" y="145" font-size="22" fill="#EAECEF" font-weight="500" text-anchor="start">Quel dentiste pour un implant près de chez moi ?</text><rect x="56" y="200" width="700" height="448" rx="20" fill="#1E2329" stroke="#2B3139" stroke-width="2"/><path d="M96,229 Q98.34,239.66 109,242 Q98.34,244.34 96,255 Q93.66,244.34 83,242 Q93.66,239.66 96,229Z" fill="#FCD535"/><text x="122" y="250" font-size="20" fill="#848E9C" font-weight="600" text-anchor="start">Réponse de l'assistant IA</text><rect x="80" y="286" width="652" height="96" rx="14" fill="#181A20" stroke="#2B3139" stroke-width="2"/><text x="108" y="326" font-size="22" fill="#EAECEF" font-weight="700" text-anchor="start">1.  Clinique A</text><text x="136" y="358" font-size="18" fill="#848E9C" font-weight="400" text-anchor="start">Implants, 4,9 étoiles, ouverte le samedi</text><rect x="80" y="398" width="652" height="96" rx="14" fill="#2A2614" stroke="#FCD535" stroke-width="3"/><text x="108" y="438" font-size="22" fill="#FCD535" font-weight="700" text-anchor="start">2.  Votre clinique</text><text x="136" y="470" font-size="18" fill="#848E9C" font-weight="400" text-anchor="start">Citée : avis sur les implants et page du soin</text><rect x="578" y="418" width="130" height="34" rx="17" fill="#0ECB81"/><text x="643.0" y="441" font-size="16" fill="#181A20" font-weight="700" text-anchor="middle">Citée</text><rect x="80" y="510" width="652" height="96" rx="14" fill="#181A20" stroke="#2B3139" stroke-width="2"/><text x="108" y="550" font-size="22" fill="#EAECEF" font-weight="700" text-anchor="start">3.  Clinique B</text><text x="136" y="582" font-size="18" fill="#848E9C" font-weight="400" text-anchor="start">Implants et sédation, nouveaux patients</text><text x="800" y="236" font-size="14" fill="#FCD535" font-weight="700" text-anchor="start" letter-spacing="1.5">CE QUI COMPTE POUR L'IA</text><circle cx="812" cy="279" r="12" fill="none" stroke="#0ECB81" stroke-width="3"/><path d="M806,279 l4,5 l8,-10" fill="none" stroke="#0ECB81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="836" y="286" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">Des avis qui mentionnent</text><text x="836" y="312" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">le soin</text><circle cx="812" cy="371" r="12" fill="none" stroke="#0ECB81" stroke-width="3"/><path d="M806,371 l4,5 l8,-10" fill="none" stroke="#0ECB81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="836" y="378" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">Une page claire pour</text><text x="836" y="404" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">chaque soin</text><circle cx="812" cy="463" r="12" fill="none" stroke="#0ECB81" stroke-width="3"/><path d="M806,463 l4,5 l8,-10" fill="none" stroke="#0ECB81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="836" y="470" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">Horaires, adresse et</text><text x="836" y="496" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">schéma Dentist</text><circle cx="812" cy="555" r="12" fill="none" stroke="#0ECB81" stroke-width="3"/><path d="M806,555 l4,5 l8,-10" fill="none" stroke="#0ECB81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="836" y="562" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">Une fiche Google</text><text x="836" y="588" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">complète</text><text x="1144" y="690" font-size="14" fill="#848E9C" font-weight="400" text-anchor="end">Exemple. Les noms de cliniques sont fictifs.</text></svg>
