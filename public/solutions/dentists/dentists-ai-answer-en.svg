<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Example of an AI assistant answering a patient's question about dental implants" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title>Example of an AI assistant answering a patient's question about dental implants</title><rect width="1200" height="720" rx="28" fill="#181A20"/><text x="56" y="72" font-size="15" fill="#FCD535" font-weight="700" text-anchor="start" letter-spacing="2">WHAT PATIENTS ASK</text><rect x="582" y="104" width="562" height="64" rx="18" fill="#2B3139"/><text x="610" y="145" font-size="22" fill="#EAECEF" font-weight="500" text-anchor="start">Who's the best dentist for implants near me?</text><rect x="56" y="200" width="700" height="448" rx="20" fill="#1E2329" stroke="#2B3139" stroke-width="2"/><path d="M96,229 Q98.34,239.66 109,242 Q98.34,244.34 96,255 Q93.66,244.34 83,242 Q93.66,239.66 96,229Z" fill="#FCD535"/><text x="122" y="250" font-size="20" fill="#848E9C" font-weight="600" text-anchor="start">AI assistant answer</text><rect x="80" y="286" width="652" height="96" rx="14" fill="#181A20" stroke="#2B3139" stroke-width="2"/><text x="108" y="326" font-size="22" fill="#EAECEF" font-weight="700" text-anchor="start">1.  Practice A</text><text x="136" y="358" font-size="18" fill="#848E9C" font-weight="400" text-anchor="start">Implants, 4.9 stars, open Saturdays</text><rect x="80" y="398" width="652" height="96" rx="14" fill="#2A2614" stroke="#FCD535" stroke-width="3"/><text x="108" y="438" font-size="22" fill="#FCD535" font-weight="700" text-anchor="start">2.  Your practice</text><text x="136" y="470" font-size="18" fill="#848E9C" font-weight="400" text-anchor="start">Mentioned: implant reviews and treatment page</text><rect x="578" y="418" width="130" height="34" rx="17" fill="#0ECB81"/><text x="643.0" y="441" font-size="16" fill="#181A20" font-weight="700" text-anchor="middle">Mentioned</text><rect x="80" y="510" width="652" height="96" rx="14" fill="#181A20" stroke="#2B3139" stroke-width="2"/><text x="108" y="550" font-size="22" fill="#EAECEF" font-weight="700" text-anchor="start">3.  Practice B</text><text x="136" y="582" font-size="18" fill="#848E9C" font-weight="400" text-anchor="start">Implants and sedation, accepts new patients</text><text x="800" y="236" font-size="14" fill="#FCD535" font-weight="700" text-anchor="start" letter-spacing="1.5">WHY ASSISTANTS PICK A PRACTICE</text><circle cx="812" cy="279" r="12" fill="none" stroke="#0ECB81" stroke-width="3"/><path d="M806,279 l4,5 l8,-10" fill="none" stroke="#0ECB81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="836" y="286" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">Reviews that mention the</text><text x="836" y="312" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">treatment</text><circle cx="812" cy="371" r="12" fill="none" stroke="#0ECB81" stroke-width="3"/><path d="M806,371 l4,5 l8,-10" fill="none" stroke="#0ECB81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="836" y="378" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">A clear page for each</text><text x="836" y="404" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">treatment</text><circle cx="812" cy="463" r="12" fill="none" stroke="#0ECB81" stroke-width="3"/><path d="M806,463 l4,5 l8,-10" fill="none" stroke="#0ECB81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="836" y="470" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">Hours, address and</text><text x="836" y="496" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">Dentist schema</text><circle cx="812" cy="555" r="12" fill="none" stroke="#0ECB81" stroke-width="3"/><path d="M806,555 l4,5 l8,-10" fill="none" stroke="#0ECB81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="836" y="562" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">A complete Google</text><text x="836" y="588" font-size="19" fill="#EAECEF" font-weight="500" text-anchor="start">Business Profile</text><text x="1144" y="690" font-size="14" fill="#848E9C" font-weight="400" text-anchor="end">Example. Practice names are placeholders.</text></svg>
