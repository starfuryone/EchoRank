<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181A20"/>
      <stop offset="1" stop-color="#1E2329"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0B90B"/>
      <stop offset="1" stop-color="#FCD535"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD535" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FCD535" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- faint grid -->
  <g stroke="#2B3139" stroke-width="1">
    <line x1="80" y1="140" x2="1120" y2="140"/>
    <line x1="80" y1="250" x2="1120" y2="250"/>
    <line x1="80" y1="360" x2="1120" y2="360"/>
    <line x1="80" y1="470" x2="1120" y2="470"/>
  </g>

  <!-- headline -->
  <text x="80" y="86" fill="#EAECEF" font-size="40" font-weight="700">Boost search rankings</text>
  <text x="80" y="118" fill="#848E9C" font-size="18">Track positions · Research keywords · Fix what holds pages back</text>

  <!-- rising rank line: y = rank position (lower is better, so line climbs) -->
  <path d="M120,500 L280,470 L440,480 L600,390 L760,330 L920,250 L1080,180"
        fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M120,500 L280,470 L440,480 L600,390 L760,330 L920,250 L1080,180 L1080,560 L120,560 Z"
        fill="url(#areaGrad)"/>

  <!-- rank badges along the line -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <g>
      <rect x="90" y="512" width="64" height="30" rx="6" fill="#2B3139"/>
      <text x="122" y="532" fill="#848E9C">#14</text>
    </g>
    <g>
      <rect x="568" y="402" width="64" height="30" rx="6" fill="#2B3139"/>
      <text x="600" y="422" fill="#EAECEF">#7</text>
    </g>
    <g>
      <rect x="1044" y="126" width="72" height="36" rx="8" fill="#FCD535"/>
      <text x="1080" y="150" fill="#181A20" font-size="18">#3</text>
    </g>
  </g>

  <!-- floating SERP card -->
  <g>
    <rect x="700" y="380" width="420" height="170" rx="14" fill="#1E2329" stroke="#2B3139"/>
    <rect x="700" y="380" width="420" height="44" rx="14" fill="#2B3139"/>
    <rect x="700" y="410" width="420" height="14" fill="#2B3139"/>
    <circle cx="726" cy="402" r="6" fill="#848E9C"/>
    <text x="744" y="408" fill="#EAECEF" font-size="15" font-weight="600">Rank Tracker</text>
    <text x="1096" y="408" fill="#FCD535" font-size="13" font-weight="700" text-anchor="end">LIVE</text>

    <!-- keyword rows -->
    <g font-size="14">
      <text x="724" y="454" fill="#EAECEF">buy running shoes online</text>
      <text x="1040" y="454" fill="#0ECB81" font-weight="700">▲ 6</text>
      <text x="1096" y="454" fill="#EAECEF" text-anchor="end" font-weight="700">#3</text>

      <text x="724" y="488" fill="#EAECEF">best trail runners 2026</text>
      <text x="1040" y="488" fill="#0ECB81" font-weight="700">▲ 4</text>
      <text x="1096" y="488" fill="#EAECEF" text-anchor="end" font-weight="700">#5</text>

      <text x="724" y="522" fill="#848E9C">running shoe store near me</text>
      <text x="1040" y="522" fill="#FCD535" font-weight="700">▲ 2</text>
      <text x="1096" y="522" fill="#848E9C" text-anchor="end" font-weight="700">#9</text>
    </g>
  </g>

  <!-- small stat chips left -->
  <g font-size="14">
    <rect x="80" y="300" width="200" height="64" rx="12" fill="#1E2329" stroke="#2B3139"/>
    <text x="100" y="327" fill="#848E9C">Keywords tracked</text>
    <text x="100" y="350" fill="#EAECEF" font-size="20" font-weight="700">128</text>

    <rect x="80" y="380" width="200" height="64" rx="12" fill="#1E2329" stroke="#2B3139"/>
    <text x="100" y="407" fill="#848E9C">Issues fixed</text>
    <text x="100" y="430" fill="#EAECEF" font-size="20" font-weight="700">47</text>
  </g>

  <!-- brand -->
  <text x="80" y="596" fill="#848E9C" font-size="14" letter-spacing="1">echorank360.com</text>
</svg>
